source:
  type: powerbi
  config:
    tenant_id: "<tenant>"
    client_id: "<app-id>"
    client_secret: "<secret>"
    workspace_id: "<workspace-guid>"

    extract_fine_grained_lineage: true
    pbitools_project_root: "/abs/path/to/Project"

sink:
  type: datahub-rest
  config:
    server: "http://localhost:8080"
    token: "${DATAHUB_TOKEN}"
